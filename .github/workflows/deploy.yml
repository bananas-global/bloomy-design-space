# Preview de cada pull request, publicado com o token da Vercel.
#
# No plano Pro, a integração Git da Vercel só publica commits de quem ocupa
# assento no time. Publicando por aqui, quem aparece como autor do deploy é o
# token: qualquer pessoa com push ganha preview. A `main` continua pela
# integração Git (ver `vercel.json`); o disparo manual segue como contingência.
name: Publicar e verificar

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

# Um deploy por branch de cada vez. Push em sequência cancela o anterior em vez de
# publicar os dois fora de ordem.
concurrency:
  group: deploy-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  publicar:
    # O GitHub não entrega secrets a PRs do Dependabot nem de forks. Esses PRs
    # continuam cobertos pelo workflow CI.
    if: >-
      github.actor != 'dependabot[bot]' &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    env:
      # Num PR, o commit publicado é o da branch, não o merge temporário que o
      # GitHub monta: é ele que o designer fez e que o dev vai referenciar.
      BRANCH: ${{ github.head_ref || github.ref_name }}
      SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SHA }}

      - uses: pnpm/action-setup@v4
        with:
          version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Num PR, typecheck e testes já rodam no CI; aqui só no disparo manual.
      - name: Typecheck
        if: github.event_name != 'pull_request'
        run: pnpm typecheck

      - name: Testes
        if: github.event_name != 'pull_request'
        run: pnpm test

      - name: Instalar a CLI da Vercel
        run: npm install --global vercel@latest

      - name: Definir o ambiente pela branch
        id: ambiente
        run: |
          if [ "${GITHUB_EVENT_NAME}" != "pull_request" ] && [ "${GITHUB_REF}" = "refs/heads/main" ]; then
            echo "alvo=production" >> "$GITHUB_OUTPUT"
            echo "flag=--prod" >> "$GITHUB_OUTPUT"
          else
            echo "alvo=preview" >> "$GITHUB_OUTPUT"
            echo "flag=" >> "$GITHUB_OUTPUT"
          fi

      - name: Puxar a configuração do projeto
        run: vercel pull --yes --environment=${{ steps.ambiente.outputs.alvo }} --token=${{ secrets.VERCEL_TOKEN }}

      # `vercel build` não repassa as variáveis do shell para o build do Vite —
      # verificado no bundle publicado, chegavam vazias. O caminho que funciona é um
      # arquivo `.env` que o próprio Vite carrega, com o prefixo `VITE_`.
      #
      # Sem isso o cabeçalho da revisão mostra "development" e fica sem branch nem
      # commit, e é o commit que torna uma aprovação rastreável.
      #
      # A URL do deploy não entra: no momento do build o deploy ainda não existe.
      # O motor cai para `window.location.origin` em tempo de execução e chega ao
      # mesmo resultado, então o botão de copiar link continua correto.
      # Gravado como arquivo lido pelo `vite.config.ts`, e não como variável de
      # ambiente: o `vercel build` não repassa o ambiente do shell ao build do Vite,
      # e sobrescreve um `.env` na raiz com o arquivo que ele mesmo gera. Ambos
      # foram testados e falharam; o log do build imprime o que foi resolvido.
      - name: Gravar o contexto do deployment
        run: |
          cat > build-info.json <<JSON
          {
            "env": "${{ steps.ambiente.outputs.alvo }}",
            "ref": "${{ env.BRANCH }}",
            "sha": "${{ env.SHA }}"
          }
          JSON
          cat build-info.json

      # O build roda aqui, no runner do GitHub. Para a Vercel sobe só o resultado.
      - name: Build
        run: vercel build ${{ steps.ambiente.outputs.flag }} --token=${{ secrets.VERCEL_TOKEN }}

      - name: Publicar
        id: deploy
        run: |
          url="$(vercel deploy --prebuilt ${{ steps.ambiente.outputs.flag }} --token=${{ secrets.VERCEL_TOKEN }})"
          if [ -z "$url" ]; then
            echo "A Vercel não retornou a URL do deployment." >&2
            exit 1
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"

      # A URL de cada deploy é imutável: um push novo ganha outra. O link que vai
      # para os devs é um alias fixo por branch, que passa a apontar para o
      # último deploy a cada push. Assim o link do sprint não muda e sempre
      # mostra a versão atual da feature.
      #
      # A URL automática de branch da Vercel (`-git-<branch>-`) só existe para
      # deploys da integração Git, que fica desligada fora da `main`.
      - name: Apontar o alias da branch
        id: alias
        if: steps.ambiente.outputs.alvo == 'preview' && steps.deploy.outputs.url != ''
        env:
          URL: ${{ steps.deploy.outputs.url }}
        run: |
          slug="$(printf '%s' "$BRANCH" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9]+/-/g; s/^-+//; s/-+$//' | cut -c1-50 | sed -E 's/-+$//')"
          alias="bloomy-ds-${slug}.vercel.app"
          vercel alias set "$URL" "$alias" --scope="$VERCEL_ORG_ID" --token=${{ secrets.VERCEL_TOKEN }}
          echo "url=https://${alias}" >> "$GITHUB_OUTPUT"

      # Os cenários novos ou alterados no PR, cada um com seu link: rota mais os
      # parâmetros que reproduzem o estado. Os que já estão na base ficam de fora.
      - name: Listar os cenários do PR
        id: cenarios
        if: steps.alias.outputs.url != ''
        # Sem a lista, o comentário sai só com o link da branch.
        continue-on-error: true
        env:
          ORIGIN: ${{ steps.alias.outputs.url }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          base=""
          if [ -n "$BASE_SHA" ] && git fetch --depth=1 origin "$BASE_SHA" \
            && git worktree add --detach ../base FETCH_HEAD; then
            ln -s "$PWD/node_modules" ../base/node_modules
            base="../base"
          fi
          node scripts/preview-links.mjs "$ORIGIN" $base > "$RUNNER_TEMP/cenarios.json"
          cat "$RUNNER_TEMP/cenarios.json"

      # O link aparece no resumo da execução, para não ter que caçar na saída dos
      # comandos. É o endereço que circula em revisão.
      - name: Mostrar o link
        if: always()
        run: |
          {
            echo "## Bloomy Design Space publicado"
            echo ""
            echo "${{ steps.alias.outputs.url || steps.deploy.outputs.url }}"
            echo ""
            echo "Componentes e layouts na raiz."
          } >> "$GITHUB_STEP_SUMMARY"

      # O link vai para o próprio PR, num comentário só, reescrito a cada push:
      # o alias da branch e um link por cenário. É o que o designer manda para os
      # devs, e é o mesmo endereço do primeiro ao último push.
      - name: Comentar o preview no PR
        if: github.event_name == 'pull_request' && steps.alias.outputs.url != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          URL: ${{ steps.alias.outputs.url }}
        run: |
          marker="<!-- design-space-preview -->"
          body="$(node -e '
            const fs = require("fs");
            const [marker, url, sha, file] = process.argv.slice(1);
            let links = [];
            try { links = JSON.parse(fs.readFileSync(file, "utf8")); } catch {}
            const lines = [marker, `**Preview:** ${url}`, ""];
            if (links.length) {
              lines.push("| Cenário | Link |", "| --- | --- |");
              for (const l of links) lines.push(`| ${l.title.replace(/\|/g, "\\|")} | [abrir](${l.url}) |`);
              lines.push("");
            }
            lines.push(`Mostra sempre o último push (commit \`${sha.slice(0, 7)}\`).`);
            console.log(lines.join("\n"));
          ' "$marker" "$URL" "$SHA" "$RUNNER_TEMP/cenarios.json")"
          existing="$(gh api "repos/${GITHUB_REPOSITORY}/issues/${PR}/comments" --paginate --jq ".[] | select(.body | startswith(\"${marker}\")) | .id" | head -n1)"
          if [ -n "$existing" ]; then
            gh api --method PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${existing}" -f body="$body" > /dev/null
          else
            gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${PR}/comments" -f body="$body" > /dev/null
          fi
