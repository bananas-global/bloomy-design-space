# Preview de cada pull request, publicado com o token da Vercel.
#
# No plano Pro, a integração Git da Vercel só publica commits de quem ocupa
# assento no time. Publicando por aqui, quem aparece como autor do deploy é o
# token: qualquer pessoa com push ganha preview. A `main` continua pela
# integração Git (ver `vercel.json`); o disparo manual segue como contingência.
name: Publicar e verificar

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

# Um deploy por branch de cada vez. Push em sequência cancela o anterior em vez de
# publicar os dois fora de ordem.
concurrency:
  group: deploy-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  publicar:
    # O GitHub não entrega secrets a PRs do Dependabot nem de forks. Esses PRs
    # continuam cobertos pelo workflow CI.
    if: >-
      github.actor != 'dependabot[bot]' &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    env:
      # Num PR, o commit publicado é o da branch, não o merge temporário que o
      # GitHub monta: é ele que o designer fez e que o dev vai referenciar.
      BRANCH: ${{ github.head_ref || github.ref_name }}
      SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SHA }}

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Num PR, typecheck e testes já rodam no CI; aqui só no disparo manual.
      - name: Typecheck
        if: github.event_name != 'pull_request'
        run: pnpm typecheck

      - name: Testes
        if: github.event_name != 'pull_request'
        run: pnpm test

      - name: Instalar a CLI da Vercel
        run: npm install --global vercel@latest

      - name: Definir o ambiente pela branch
        id: ambiente
        run: |
          if [ "${GITHUB_EVENT_NAME}" != "pull_request" ] && [ "${GITHUB_REF}" = "refs/heads/main" ]; then
            echo "alvo=production" >> "$GITHUB_OUTPUT"
            echo "flag=--prod" >> "$GITHUB_OUTPUT"
          else
            echo "alvo=preview" >> "$GITHUB_OUTPUT"
            echo "flag=" >> "$GITHUB_OUTPUT"
          fi

      - name: Puxar a configuração do projeto
        run: vercel pull --yes --environment=${{ steps.ambiente.outputs.alvo }} --token=${{ secrets.VERCEL_TOKEN }}

      # `vercel build` não repassa as variáveis do shell para o build do Vite —
      # verificado no bundle publicado, chegavam vazias. O caminho que funciona é um
      # arquivo `.env` que o próprio Vite carrega, com o prefixo `VITE_`.
      #
      # Sem isso o cabeçalho da revisão mostra "development" e fica sem branch nem
      # commit, e é o commit que torna uma aprovação rastreável.
      #
      # A URL do deploy não entra: no momento do build o deploy ainda não existe.
      # O motor cai para `window.location.origin` em tempo de execução e chega ao
      # mesmo resultado, então o botão de copiar link continua correto.
      # Gravado como arquivo lido pelo `vite.config.ts`, e não como variável de
      # ambiente: o `vercel build` não repassa o ambiente do shell ao build do Vite,
      # e sobrescreve um `.env` na raiz com o arquivo que ele mesmo gera. Ambos
      # foram testados e falharam; o log do build imprime o que foi resolvido.
      - name: Gravar o contexto do deployment
        run: |
          cat > build-info.json <<JSON
          {
            "env": "${{ steps.ambiente.outputs.alvo }}",
            "ref": "${{ env.BRANCH }}",
            "sha": "${{ env.SHA }}"
          }
          JSON
          cat build-info.json

      # O build roda aqui, no runner do GitHub. Para a Vercel sobe só o resultado.
      - name: Build
        run: vercel build ${{ steps.ambiente.outputs.flag }} --token=${{ secrets.VERCEL_TOKEN }}

      - name: Publicar
        id: deploy
        run: |
          url="$(vercel deploy --prebuilt ${{ steps.ambiente.outputs.flag }} --token=${{ secrets.VERCEL_TOKEN }})"
          if [ -z "$url" ]; then
            echo "A Vercel não retornou a URL do deployment." >&2
            exit 1
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"

      # O link aparece no resumo da execução, para não ter que caçar na saída dos
      # comandos. É o endereço que circula em revisão.
      - name: Mostrar o link
        if: always()
        run: |
          {
            echo "## Bloomy Design Space publicado"
            echo ""
            echo "${{ steps.deploy.outputs.url }}"
            echo ""
            echo "Componentes e layouts na raiz."
          } >> "$GITHUB_STEP_SUMMARY"

      # O link vai para o próprio PR, num comentário só, atualizado a cada push:
      # é o endereço que o designer manda para os devs. É a URL fixa deste
      # deploy — não muda com pushes seguintes, que ganham URL própria.
      - name: Comentar o preview no PR
        if: github.event_name == 'pull_request' && steps.deploy.outputs.url != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          URL: ${{ steps.deploy.outputs.url }}
        run: |
          marker="<!-- design-space-preview -->"
          body="$(printf '%s\n**Preview:** %s\n\nCommit `%s`. O endereço é fixo: cada push novo publica outro e atualiza este comentário.' "$marker" "$URL" "${SHA:0:7}")"
          existing="$(gh api "repos/${GITHUB_REPOSITORY}/issues/${PR}/comments" --paginate --jq ".[] | select(.body | startswith(\"${marker}\")) | .id" | head -n1)"
          if [ -n "$existing" ]; then
            gh api --method PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${existing}" -f body="$body" > /dev/null
          else
            gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${PR}/comments" -f body="$body" > /dev/null
          fi
