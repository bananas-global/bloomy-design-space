# Publicação manual de contingência. O deploy automático da main usa a integração Git.
name: Publicar e verificar

on:
  workflow_dispatch:

# Um deploy por branch de cada vez. Push em sequência cancela o anterior em vez de
# publicar os dois fora de ordem.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  publicar:
    # O GitHub não entrega secrets a workflows disparados por pushes do
    # Dependabot. Esses PRs continuam cobertos pelo workflow CI.
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Typecheck e testes antes de publicar: falha rápida e barata, sem gastar um
      # deploy. A jornada Playwright fica depois, porque ela testa o que foi
      # publicado de verdade.
      - name: Typecheck
        run: pnpm typecheck

      - name: Testes
        run: pnpm test

      - name: Instalar a CLI da Vercel
        run: npm install --global vercel@latest

      - name: Definir o ambiente pela branch
        id: ambiente
        run: |
          if [ "${GITHUB_REF}" = "refs/heads/main" ]; then
            echo "alvo=production" >> "$GITHUB_OUTPUT"
            echo "flag=--prod" >> "$GITHUB_OUTPUT"
          else
            echo "alvo=preview" >> "$GITHUB_OUTPUT"
            echo "flag=" >> "$GITHUB_OUTPUT"
          fi

      - name: Puxar a configuração do projeto
        run: vercel pull --yes --environment=${{ steps.ambiente.outputs.alvo }} --token=${{ secrets.VERCEL_TOKEN }}

      # `vercel build` não repassa as variáveis do shell para o build do Vite —
      # verificado no bundle publicado, chegavam vazias. O caminho que funciona é um
      # arquivo `.env` que o próprio Vite carrega, com o prefixo `VITE_`.
      #
      # Sem isso o cabeçalho da revisão mostra "development" e fica sem branch nem
      # commit, e é o commit que torna uma aprovação rastreável.
      #
      # A URL do deploy não entra: no momento do build o deploy ainda não existe.
      # O motor cai para `window.location.origin` em tempo de execução e chega ao
      # mesmo resultado, então o botão de copiar link continua correto.
      # Gravado como arquivo lido pelo `vite.config.ts`, e não como variável de
      # ambiente: o `vercel build` não repassa o ambiente do shell ao build do Vite,
      # e sobrescreve um `.env` na raiz com o arquivo que ele mesmo gera. Ambos
      # foram testados e falharam; o log do build imprime o que foi resolvido.
      - name: Gravar o contexto do deployment
        run: |
          cat > build-info.json <<JSON
          {
            "env": "${{ steps.ambiente.outputs.alvo }}",
            "ref": "${{ github.ref_name }}",
            "sha": "${{ github.sha }}"
          }
          JSON
          cat build-info.json

      # O build roda aqui, no runner do GitHub. Para a Vercel sobe só o resultado.
      - name: Build
        run: vercel build ${{ steps.ambiente.outputs.flag }} --token=${{ secrets.VERCEL_TOKEN }}

      - name: Publicar
        id: deploy
        run: |
          url="$(vercel deploy --prebuilt ${{ steps.ambiente.outputs.flag }} --token=${{ secrets.VERCEL_TOKEN }})"
          if [ -z "$url" ]; then
            echo "A Vercel não retornou a URL do deployment." >&2
            exit 1
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"

      # O link aparece no resumo da execução, para não ter que caçar na saída dos
      # comandos. É o endereço que circula em revisão.
      - name: Mostrar o link
        if: always()
        run: |
          {
            echo "## Bloomy Design Space publicado"
            echo ""
            echo "${{ steps.deploy.outputs.url }}"
            echo ""
            echo "Componentes e layouts na raiz."
          } >> "$GITHUB_STEP_SUMMARY"
