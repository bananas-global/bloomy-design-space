# CI do repositório de design.
#
# Governança proporcional (Princípio 9): iteração visual acontece local, sem PR
# por mudança. Este workflow existe para o que é barato e pega erro caro —
# typecheck, contrato de cenário, contraste dos tokens e build.
#
# A jornada Playwright com axe não roda aqui: ela precisa de uma URL publicada, e
# quem publica é o `deploy.yml`. Rodar contra um build local testaria um artefato
# que ninguém revisa.
name: CI

# Só em pull request. Em push, quem roda typecheck e testes é o `deploy.yml`, antes
# de publicar — rodar nos dois seria pagar duas vezes pela mesma verificação.
on:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Contrato de cenário, regras e contraste dos tokens
        run: pnpm test

      - name: Build
        run: pnpm build
