# CI do repositório de design: typecheck, testes e build em cada PR.
name: CI

# Só em pull request. Em push, quem roda typecheck e testes é o `deploy.yml`, antes
# de publicar — rodar nos dois seria pagar duas vezes pela mesma verificação.
on:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Testes
        run: pnpm test

      - name: Build
        run: pnpm build
