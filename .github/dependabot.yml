# Atualização das dependências por PR do Dependabot, uma vez por semana.
#
# O merge é automático só para o Dependabot: `.github/workflows/automerge.yml`
# mescla os PRs dele na main como brucesantos. PR de pessoa do time é handoff
# e fica aberto. O motor fica num grupo próprio para que o PR dele seja
# separado e fácil de achar no histórico quando uma tela mudar.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # O motor separado das outras dependências: o PR dele é o que exige olhar a
    # tela, não só o CI verde.
    groups:
      design-space-engine:
        patterns:
          - "@brucesantos/design-space"
      # `react` e `react-dom` sobem juntos: com versões diferentes, o React 19 se
      # recusa a montar, e o merge automático publicaria a tela em branco.
      react:
        patterns:
          - react
          - react-dom
      dev-tooling:
        patterns:
          - "*"
        exclude-patterns:
          - "@brucesantos/design-space"
          - react
          - react-dom
        update-types:
          - minor
          - patch
    labels:
      - dependências
    commit-message:
      prefix: deps
