# Atualização das dependências por PR do Dependabot, uma vez por semana.
#
# O merge é automático: `.github/workflows/automerge.yml` mescla os PRs do
# Dependabot na main como brucesantos. O motor fica num grupo próprio para que o
# PR dele seja separado e fácil de achar no histórico quando uma tela mudar.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # O motor separado das outras dependências: o PR dele é o que exige olhar a
    # tela, não só o CI verde.
    groups:
      design-space-engine:
        patterns:
          - "@brucesantos/design-space"
      dev-tooling:
        patterns:
          - "*"
        exclude-patterns:
          - "@brucesantos/design-space"
          - react
          - react-dom
        update-types:
          - minor
          - patch
    labels:
      - dependências
    commit-message:
      prefix: deps
